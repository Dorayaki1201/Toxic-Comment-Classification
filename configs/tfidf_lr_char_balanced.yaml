# Baseline TF-IDF + Logistic Regression (cấu hình A: không chuẩn hóa teencode).
# Chạy: python -m src.train --config configs/tfidf_lr_char_balanced.yaml
name: tfidf_lr_char_balanced
seed: 42
data_dir: data/raw/vihsd

features:
  word: null
  char: {ngram_range: [2, 5], min_df: 2, sublinear_tf: true}

model:
  C: 1.0
  class_weight: balanced
  max_iter: 1000
