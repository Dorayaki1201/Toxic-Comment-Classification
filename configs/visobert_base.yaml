# ViSoBERT fine-tune, không chuẩn hóa (cấu hình A), loss thường (chưa cân bằng nhãn).
# Siêu tham số theo giá trị phổ biến, chưa dò (xem docs/decisions.md).
name: visobert_base
type: transformer
seed: 42
data_dir: data/raw/vihsd

model:
  pretrained: uitnlp/visobert   # kiểm tra lại tên trên HuggingFace Hub trước khi chạy
  max_length: 128               # đo trên train: chỉ 0.07% câu dài hơn (D-017)
  class_weight: null            # null | balanced (phần 2b)

training:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 4
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true                    # chỉ bật khi có GPU
  max_train_samples: null       # null = dùng toàn bộ train
